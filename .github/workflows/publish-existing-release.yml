name: Publish Existing Build Artifacts

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Existing release tag, for example v8.1.1_10"
        required: true
        type: string
      source_run_id:
        description: "Completed build workflow run ID containing release-* artifacts"
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Publish GitHub Release from existing artifacts
    runs-on: ubuntu-24.04

    steps:
      - name: Check out release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Verify release tag and source run
        id: release_context
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! "$RELEASE_TAG" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          if [[ ! "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]; then
            echo "::error::Invalid source workflow run ID: $SOURCE_RUN_ID"
            exit 1
          fi

          run_json="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}")"
          run_status="$(jq -r '.status' <<<"$run_json")"
          run_tag="$(jq -r '.head_branch' <<<"$run_json")"
          if [[ "$run_status" != "completed" || "$run_tag" != "$RELEASE_TAG" ]]; then
            echo "::error::Source run must be completed and belong to $RELEASE_TAG."
            echo "::error::status=$run_status tag=$run_tag"
            exit 1
          fi

          artifact_version="$(
            sed -n 's/^#define FFMPEG_KIT_VERSION "\([^"]*\)"/\1/p' \
              android/ffmpeg-kit-next-android-lib/src/main/cpp/ffmpegkit.h
          )"
          if [[ -z "$artifact_version" ]]; then
            echo "::error::Could not resolve the artifact version from the release tag source."
            exit 1
          fi

          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"

      - name: Download release assets from source run
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}

      - name: Verify Android ABI packages
        shell: bash
        run: |
          set -euo pipefail

          expected_suffixes=(
            android-all-lgpl3
            android-all-gpl3
            android-armeabi-v7a-lgpl3
            android-armeabi-v7a-neon-lgpl3
            android-arm64-v8a-lgpl3
            android-x86-lgpl3
            android-x86_64-lgpl3
          )

          for suffix in "${expected_suffixes[@]}"; do
            matches=(dist/ffmpeg-kit-next-*-"$suffix".aar)
            if (( ${#matches[@]} != 1 )) || [[ ! -f "${matches[0]}" ]]; then
              echo "::error::Expected exactly one Android $suffix AAR release asset."
              exit 1
            fi
            echo "$suffix: $(stat -c %s "${matches[0]}") bytes"
          done

          android_aars=(dist/ffmpeg-kit-next-*-android-*.aar)
          if (( ${#android_aars[@]} != ${#expected_suffixes[@]} )); then
            echo "::error::Expected ${#expected_suffixes[@]} Android ABI AARs; found ${#android_aars[@]}."
            exit 1
          fi

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          ARTIFACT_VERSION: ${{ steps.release_context.outputs.artifact_version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "FFmpegKitNext ${ARTIFACT_VERSION}" \
              --generate-notes \
              --notes "Prebuilt artifacts for Android, Linux x86_64/ARM64, WebAssembly, iOS/iPadOS, Mac Catalyst, macOS, tvOS, and visionOS. Every Android artifact name explicitly ends in lgpl3 or gpl3 to prevent license confusion. The LGPLv3 builds include all-ABI and separate-ABI AARs, are intended for compliant integration into closed-source apps, and contain no GPL or nonfree configuration. The all-ABI GPLv3 build additionally includes x264 and x265 and is not a proprietary commercial license. Every Android package includes shared FFmpeg libraries, MediaCodec, libvpx, and libmp3lame. Apple, Linux, and Web artifacts remain LGPLv3."
          fi
