name: Build All Platforms and Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag, for example v8.1.1 or v8.1.1.11"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: all-platform-release-${{ github.ref }}-${{ inputs.release_tag }}
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare release
    runs-on: ubuntu-24.04
    outputs:
      artifact_version: ${{ steps.release_context.outputs.artifact_version }}
      release_tag: ${{ steps.release_context.outputs.release_tag }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Resolve and verify release information
        id: release_context
        env:
          MANUAL_RELEASE_TAG: ${{ inputs.release_tag }}
        shell: bash
        run: |
          set -euo pipefail

          android_version="$(
            sed -n 's/^#define FFMPEG_KIT_VERSION "\([^"]*\)"/\1/p' \
              android/ffmpeg-kit-next-android-lib/src/main/cpp/ffmpegkit.h
          )"
          apple_version="$(
            sed -n 's/.*const FFmpegKitVersion.*@"\([^"]*\)".*/\1/p' \
              apple/src/FFmpegKitConfig.m
          )"
          linux_version="$(
            sed -n 's/.*FFmpegKitVersion = "\([^"]*\)".*/\1/p' \
              linux/src/FFmpegKitConfig.h
          )"
          web_version="$(
            sed -n 's/.*FFmpegKitVersion = "\([^"]*\)".*/\1/p' \
              web/src/FFmpegKitConfig.h
          )"

          artifact_version="$android_version"
          for platform_version in "$apple_version" "$linux_version" "$web_version"; do
            if [[ -z "$artifact_version" || "$platform_version" != "$artifact_version" ]]; then
              echo "::error::Platform source versions do not match."
              echo "::error::Android=$android_version Apple=$apple_version Linux=$linux_version Web=$web_version"
              exit 1
            fi
          done

          if [[ "$GITHUB_EVENT_NAME" == "push" ]]; then
            release_tag="$GITHUB_REF_NAME"
          else
            release_tag="$MANUAL_RELEASE_TAG"
          fi

          if [[ ! "$release_tag" =~ ^v[0-9][0-9A-Za-z._-]*$ ]]; then
            echo "::error::Release tag must start with v and contain only letters, numbers, dot, underscore, or dash."
            exit 1
          fi

          if [[ "$release_tag" != "v${artifact_version}" &&
                "$release_tag" != "v${artifact_version}-"* &&
                "$release_tag" != "v${artifact_version}_"* ]]; then
            echo "::error::Release tag ${release_tag} does not match source version ${artifact_version}."
            echo "::error::Use v${artifact_version} or a numeric suffix such as v${artifact_version}.11."
            exit 1
          fi

          echo "artifact_version=$artifact_version" >> "$GITHUB_OUTPUT"
          echo "release_tag=$release_tag" >> "$GITHUB_OUTPUT"

  build_android:
    name: Android (${{ matrix.target }})
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: all
            suffix: android-all-lgpl3
            archive_abis: arm64-v8a armeabi-v7a x86 x86_64
            license_family: lgpl3
          - target: all-gpl3
            suffix: android-all-gpl3
            archive_abis: arm64-v8a armeabi-v7a x86 x86_64
            license_family: gpl3
          - target: arm-v7a
            suffix: android-armeabi-v7a-lgpl3
            archive_abis: armeabi-v7a
            license_family: lgpl3
          - target: arm-v7a-neon
            suffix: android-armeabi-v7a-neon-lgpl3
            archive_abis: armeabi-v7a
            license_family: lgpl3
          - target: arm64-v8a
            suffix: android-arm64-v8a-lgpl3
            archive_abis: arm64-v8a
            license_family: lgpl3
          - target: x86
            suffix: android-x86-lgpl3
            archive_abis: x86
            license_family: lgpl3
          - target: x86-64
            suffix: android-x86_64-lgpl3
            archive_abis: x86_64
            license_family: lgpl3

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.8

      - name: Restore and save Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Build Android ${{ matrix.target }} package
        env:
          TARGET: ${{ matrix.target }}
        shell: bash
        run: |
          set -euo pipefail

          # Publish both an all-ABI package for app bundles and the existing
          # single-ABI packages. FFmpeg's built-in formats and stream-copy
          # features remain enabled in every package. libvpx and LAME add
          # VP8/VP9 and MP3 encoding while keeping the build under LGPL. The
          # wrapper's Android MediaCodec option maps to FFmpeg's
          # --enable-mediacodec configure flag for hardware codecs.
          codec_options=(
            --enable-libvpx
            --enable-lame
            --enable-android-media-codec
          )

          case "$TARGET" in
            all)
              ./nix-android.sh -p android-r27d \
                "${codec_options[@]}"
              ;;
            all-gpl3)
              ./nix-android.sh -p android-r27d \
                "${codec_options[@]}" \
                --enable-gpl \
                --enable-x264 \
                --enable-x265
              ;;
            arm-v7a)
              ./nix-android.sh -p android-r27d \
                "${codec_options[@]}" \
                --disable-arm-v7a-neon \
                --disable-arm64-v8a \
                --disable-x86 \
                --disable-x86-64
              ;;
            arm-v7a-neon)
              ./nix-android.sh -p android-r27d \
                "${codec_options[@]}" \
                --disable-arm-v7a \
                --disable-arm64-v8a \
                --disable-x86 \
                --disable-x86-64
              ;;
            arm64-v8a)
              ./nix-android.sh -p android-r27d \
                "${codec_options[@]}" \
                --disable-arm-v7a \
                --disable-arm-v7a-neon \
                --disable-x86 \
                --disable-x86-64
              ;;
            x86)
              ./nix-android.sh -p android-r27d \
                "${codec_options[@]}" \
                --disable-arm-v7a \
                --disable-arm-v7a-neon \
                --disable-arm64-v8a \
                --disable-x86-64
              ;;
            x86-64)
              ./nix-android.sh -p android-r27d \
                "${codec_options[@]}" \
                --disable-arm-v7a \
                --disable-arm-v7a-neon \
                --disable-arm64-v8a \
                --disable-x86
              ;;
            *)
              echo "::error::Unknown Android target: $TARGET"
              exit 1
              ;;
          esac

      - name: Verify and package Android assets
        env:
          ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
          TARGET: ${{ matrix.target }}
          ASSET_SUFFIX: ${{ matrix.suffix }}
          EXPECTED_ABIS: ${{ matrix.archive_abis }}
          LICENSE_FAMILY: ${{ matrix.license_family }}
        shell: bash
        run: |
          set -euo pipefail

          maven_repository="prebuilt/bundle-android-aar-24-maven"
          source_aar="$maven_repository/com/arthenica/ffmpeg-kit-next/$ARTIFACT_VERSION/ffmpeg-kit-next-$ARTIFACT_VERSION.aar"
          source_pom="$maven_repository/com/arthenica/ffmpeg-kit-next/$ARTIFACT_VERSION/ffmpeg-kit-next-$ARTIFACT_VERSION.pom"

          test -f "$source_aar"
          test -f "$source_pom"

          archive_entries="$(unzip -Z1 "$source_aar")"
          packaged_abis="$(
            printf '%s\n' "$archive_entries" |
              sed -n 's#^jni/\([^/]*\)/.*\.so$#\1#p' |
              sort -u
          )"

          expected_abis="$(tr ' ' '\n' <<< "$EXPECTED_ABIS" | sed '/^$/d' | sort -u)"
          if [[ "$packaged_abis" != "$expected_abis" ]]; then
            echo "::error::Android $TARGET AAR has unexpected ABIs."
            echo "::error::Expected: $expected_abis"
            echo "::error::Found: $packaged_abis"
            exit 1
          fi

          if grep -q "^prefab/" <<< "$archive_entries"; then
            echo "::error::Android $TARGET AAR unexpectedly contains Prefab metadata."
            exit 1
          fi

          verify_dir="$RUNNER_TEMP/ffmpeg-kit-aar-$TARGET"
          mkdir -p "$verify_dir"
          verification_abi="$(head -n 1 <<< "$packaged_abis")"
          libavutil_entry=""
          while IFS= read -r entry; do
            case "$entry" in
              "jni/$verification_abi/libavutil.so"|"jni/$verification_abi/libavutil_neon.so")
                libavutil_entry="$entry"
                break
                ;;
            esac
          done <<< "$archive_entries"

          if [[ -z "$libavutil_entry" ]]; then
            echo "::error::Android $TARGET AAR has no libavutil library for $verification_abi."
            exit 1
          fi

          libavutil="$verify_dir/libavutil.so"
          metadata="$verify_dir/libavutil.strings"
          unzip -p "$source_aar" "$libavutil_entry" > "$libavutil"
          strings "$libavutil" > "$metadata"

          require_flag() {
            if ! grep -Fq -- "$1" "$metadata"; then
              echo "::error::Android $TARGET is missing required FFmpeg configuration flag $1."
              exit 1
            fi
          }

          reject_flag() {
            if grep -Fq -- "$1" "$metadata"; then
              echo "::error::Android $TARGET unexpectedly contains FFmpeg configuration flag $1."
              exit 1
            fi
          }

          require_exact_metadata() {
            if ! grep -Fxq -- "$1" "$metadata"; then
              echo "::error::Android $TARGET is missing expected metadata: $1"
              exit 1
            fi
          }

          require_flag --disable-static
          require_flag --enable-shared
          require_flag --enable-mediacodec
          require_flag --enable-libvpx
          require_flag --enable-libmp3lame
          reject_flag --enable-nonfree

          license_file="$verify_dir/license.txt"
          unzip -p "$source_aar" res/raw/license.txt > "$license_file"
          license_header="$(sed -n '1,4p' "$license_file")"
          case "$LICENSE_FAMILY" in
            lgpl3)
              grep -Fq "GNU LESSER GENERAL PUBLIC LICENSE" <<< "$license_header"
              grep -Fq "Version 3" <<< "$license_header"
              require_exact_metadata "libavutil license: LGPL version 3 or later"
              reject_flag --enable-gpl
              reject_flag --enable-libx264
              reject_flag --enable-libx265
              ;;
            gpl3)
              grep -Eq '^[[:space:]]*GNU GENERAL PUBLIC LICENSE[[:space:]]*$' <<< "$license_header"
              grep -Fq "Version 3" <<< "$license_header"
              require_exact_metadata "libavutil license: GPL version 3 or later"
              require_flag --enable-gpl
              require_flag --enable-libx264
              require_flag --enable-libx265
              ;;
            *)
              echo "::error::Unknown Android license family: $LICENSE_FAMILY"
              exit 1
              ;;
          esac

          if grep -Fxq "arm64-v8a" <<< "$packaged_abis"; then
            unzip -qq "$source_aar" "jni/arm64-v8a/*.so" -d "$verify_dir"

            for library in "$verify_dir"/jni/arm64-v8a/*.so; do
              while read -r alignment; do
                if (( alignment < 0x4000 )); then
                  echo "::error::$library has LOAD alignment $alignment; expected at least 0x4000."
                  exit 1
                fi
              done < <(readelf -lW "$library" | awk '$1 == "LOAD" { print $NF }')
            done
          fi

          mkdir -p release-dist
          aar_asset="ffmpeg-kit-next-${ARTIFACT_VERSION}-${ASSET_SUFFIX}.aar"
          pom_asset="ffmpeg-kit-next-${ARTIFACT_VERSION}-${ASSET_SUFFIX}.pom"
          maven_asset="ffmpeg-kit-next-${ARTIFACT_VERSION}-${ASSET_SUFFIX}-maven.tar.gz"

          cp "$source_aar" "release-dist/$aar_asset"
          cp "$source_pom" "release-dist/$pom_asset"
          tar -C "$maven_repository" -czf "release-dist/$maven_asset" .

          if [[ "$TARGET" == "arm64-v8a" ]]; then
            cat > release-dist/STREAM-COPY-GUIDE-android.txt <<'EOF'
          Fast keyframe-aligned cut (place -ss before -i for fast input seeking):
            -ss 00:01:00 -i input.mp4 -t 00:00:30 -map 0 -c copy -avoid_negative_ts make_zero -movflags +faststart output.mp4

          Concat files with matching codecs, dimensions and stream layouts:
            -fflags +genpts -f concat -safe 0 -i list.txt -map 0 -c copy -avoid_negative_ts make_zero -movflags +faststart output.mp4

          list.txt format:
            file 'part1.mp4'
            file 'part2.mp4'

          Notes:
            - Stream-copy cuts are limited to existing keyframes. Exact frame cuts require re-encoding around the cut.
            - -avoid_negative_ts make_zero normalizes negative timestamps after a seek or concat.
            - -fflags +genpts generates missing presentation timestamps when concatenating problematic inputs.
            - -movflags +faststart moves MP4/MOV metadata to the front for faster opening and seeking.
            - To preserve the original timeline instead, use -copyts -start_at_zero and omit timestamp normalization.
          EOF
          fi

      - name: Upload Android release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.suffix }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Android build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-${{ matrix.suffix }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

  build_compliance:
    name: Build compliance source bundle
    needs:
      - prepare
      - build_android
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read

    steps:
      - name: Check out exact release source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download Android all-ABI artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-android-all-*
          path: android-dist
          merge-multiple: true

      - name: Create corresponding source and compliance assets
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
          ANDROID_DIST: android-dist
          OUTPUT_DIR: release-dist
          PREVIOUS_TAG: v8.1.1_10
        shell: bash
        run: bash scripts/ci/create-compliance-assets.sh

      - name: Upload compliance release assets
        uses: actions/upload-artifact@v7
        with:
          name: release-compliance
          path: release-dist/
          if-no-files-found: error
          retention-days: 14

  build_linux:
    name: Linux (${{ matrix.arch }})
    needs: prepare
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.8

      - name: Restore and save Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Build Linux bundle
        shell: bash
        run: ./nix-linux.sh -p default

      - name: Package Linux bundle
        env:
          ARCH: ${{ matrix.arch }}
          ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
        shell: bash
        run: |
          set -euo pipefail

          bundle_root="prebuilt/bundle-linux"
          test -d "$bundle_root/ffmpeg-kit-next"

          mkdir -p release-dist
          asset="ffmpeg-kit-next-${ARTIFACT_VERSION}-linux-${ARCH}.tar.gz"
          tar -C "$bundle_root" -czf "release-dist/$asset" ffmpeg-kit-next

      - name: Upload Linux release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-${{ matrix.arch }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Linux build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-linux-${{ matrix.arch }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

  build_web:
    name: WebAssembly
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.8

      - name: Restore and save Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Build WebAssembly package
        shell: bash
        run: ./nix-web.sh -p web-wasm32-emscripten

      - name: Create installable npm package
        env:
          ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
        shell: bash
        run: |
          set -euo pipefail

          package_root="prebuilt/bundle-web-wasm32/ffmpeg-kit-next"
          test -f "$package_root/package.json"
          test -f "$package_root/lib/libffmpegkit.wasm"

          mkdir -p release-dist
          packed_name="$(npm pack "$package_root" --pack-destination release-dist)"
          asset="ffmpeg-kit-next-${ARTIFACT_VERSION}-web-wasm32.tgz"
          mv "release-dist/$packed_name" "release-dist/$asset"

      - name: Upload Web release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-web
          path: release-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Web build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-web
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

  build_apple:
    name: Apple (${{ matrix.platform }})
    needs: prepare
    # Determinate Nix no longer supports Intel macOS hosts. Apple Silicon
    # still cross-compiles the x86_64 slices included in the XCFrameworks.
    runs-on: macos-26
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            wrapper: nix-ios.sh
          - platform: macos
            wrapper: nix-macos.sh
          - platform: tvos
            wrapper: nix-tvos.sh
          - platform: visionos
            wrapper: nix-visionos.sh

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Verify Apple Silicon and Xcode SDKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk appletvos --show-sdk-version
          xcrun --sdk xros --show-sdk-version

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.8
        with:
          kvm: false

      - name: Restore and save Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Build XCFrameworks and Swift package
        env:
          WRAPPER: ${{ matrix.wrapper }}
        shell: bash
        run: ./"$WRAPPER" -p xcode26 -x --spm

      - name: Package Apple platform
        env:
          PLATFORM: ${{ matrix.platform }}
          ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
        shell: bash
        run: |
          set -euo pipefail

          bundle_dirs=()
          while IFS= read -r directory; do
            bundle_dirs+=("$directory")
          done < <(
            find prebuilt -mindepth 1 -maxdepth 1 -type d \
              -name "bundle-apple-xcframework-${PLATFORM}-*" -print
          )

          if (( ${#bundle_dirs[@]} != 1 )); then
            echo "::error::Expected one $PLATFORM XCFramework bundle; found ${#bundle_dirs[@]}."
            exit 1
          fi

          bundle="${bundle_dirs[0]}"
          test -f "$bundle/Package.swift"
          if ! find "$bundle" -mindepth 1 -maxdepth 1 -type d -name "*.xcframework" | grep -q .; then
            echo "::error::No XCFrameworks found in $bundle."
            exit 1
          fi

          mkdir -p release-dist framework-staging
          asset="ffmpeg-kit-next-${ARTIFACT_VERSION}-apple-${PLATFORM}.zip"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "release-dist/$asset"

          framework_names=()
          while IFS= read -r directory; do
            framework_names+=("$(basename "$directory")")
          done < <(
            find prebuilt -mindepth 1 -maxdepth 1 -type d \
              -name "bundle-apple-framework-*" -print
          )

          if (( ${#framework_names[@]} == 0 )); then
            echo "::error::No intermediate Apple frameworks found for umbrella packaging."
            exit 1
          fi

          tar -C prebuilt -cf "framework-staging/apple-frameworks-${PLATFORM}.tar" \
            "${framework_names[@]}"

      - name: Upload Apple release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-apple-${{ matrix.platform }}
          path: release-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload frameworks for umbrella package
        uses: actions/upload-artifact@v7
        with:
          name: apple-frameworks-${{ matrix.platform }}
          path: framework-staging/*.tar
          if-no-files-found: error
          retention-days: 1

      - name: Upload Apple build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-apple-${{ matrix.platform }}
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

  build_apple_umbrella:
    name: Apple universal Swift package
    needs:
      - prepare
      - build_apple
    runs-on: macos-26
    timeout-minutes: 120

    steps:
      - name: Check out source and tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download platform frameworks
        uses: actions/download-artifact@v8
        with:
          pattern: apple-frameworks-*
          path: framework-staging
          merge-multiple: true

      - name: Restore platform frameworks
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p prebuilt
          archive_count=0
          for archive in framework-staging/*.tar; do
            test -f "$archive"
            tar -C prebuilt -xf "$archive"
            archive_count=$((archive_count + 1))
          done

          if (( archive_count != 4 )); then
            echo "::error::Expected four Apple framework archives; found $archive_count."
            exit 1
          fi

      - name: Verify Apple Silicon and Xcode SDKs
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = "arm64"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version
          xcrun --sdk appletvos --show-sdk-version
          xcrun --sdk xros --show-sdk-version

      - name: Install Nix
        uses: DeterminateSystems/determinate-nix-action@v3.21.8
        with:
          kvm: false

      - name: Restore and save Nix store cache
        uses: DeterminateSystems/magic-nix-cache-action@v14
        with:
          use-flakehub: false

      - name: Create umbrella XCFrameworks and Swift package
        shell: bash
        run: ./nix-apple.sh -p xcode26 --spm

      - name: Package universal Apple bundle
        env:
          ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
        shell: bash
        run: |
          set -euo pipefail

          bundle_dirs=()
          while IFS= read -r directory; do
            bundle_dirs+=("$directory")
          done < <(
            find prebuilt -mindepth 1 -maxdepth 1 -type d \
              -name "umbrella-apple-xcframework-*" -print
          )

          if (( ${#bundle_dirs[@]} != 1 )); then
            echo "::error::Expected one umbrella Apple bundle; found ${#bundle_dirs[@]}."
            exit 1
          fi

          bundle="${bundle_dirs[0]}"
          test -f "$bundle/Package.swift"

          mkdir -p release-dist
          asset="ffmpeg-kit-next-${ARTIFACT_VERSION}-apple-universal.zip"
          ditto -c -k --sequesterRsrc --keepParent "$bundle" "release-dist/$asset"

      - name: Upload universal Apple release asset
        uses: actions/upload-artifact@v7
        with:
          name: release-apple-universal
          path: release-dist/
          if-no-files-found: error
          retention-days: 14

      - name: Upload umbrella build log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: build-log-apple-universal
          path: build.log
          if-no-files-found: ignore
          retention-days: 14

  release:
    name: Publish GitHub Release
    needs:
      - prepare
      - build_android
      - build_compliance
      - build_linux
      - build_web
      - build_apple
      - build_apple_umbrella
    runs-on: ubuntu-24.04
    permissions:
      contents: write

    steps:
      - name: Download all release assets
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Verify Android ABI packages
        shell: bash
        run: |
          set -euo pipefail

          expected_suffixes=(
            android-all-lgpl3
            android-all-gpl3
            android-armeabi-v7a-lgpl3
            android-armeabi-v7a-neon-lgpl3
            android-arm64-v8a-lgpl3
            android-x86-lgpl3
            android-x86_64-lgpl3
          )

          for suffix in "${expected_suffixes[@]}"; do
            matches=(dist/ffmpeg-kit-next-*-"$suffix".aar)
            if (( ${#matches[@]} != 1 )) || [[ ! -f "${matches[0]}" ]]; then
              echo "::error::Expected exactly one Android $suffix AAR release asset."
              exit 1
            fi
            echo "$suffix: $(stat -c %s "${matches[0]}") bytes"
          done

          android_aars=(dist/ffmpeg-kit-next-*-android-*.aar)
          if (( ${#android_aars[@]} != ${#expected_suffixes[@]} )); then
            echo "::error::Expected ${#expected_suffixes[@]} Android ABI AARs; found ${#android_aars[@]}."
            exit 1
          fi

      - name: Generate checksums
        shell: bash
        run: |
          set -euo pipefail

          (
            cd dist
            find . -maxdepth 1 -type f ! -name SHA256SUMS -printf '%f\0' |
              sort -z |
              xargs -0 sha256sum > SHA256SUMS
          )

      - name: Verify compliance assets
        shell: bash
        run: |
          set -euo pipefail

          required_assets=(
            BUILD_INFO.txt
            THIRD_PARTY_NOTICES.md
            COPYING.LGPLv3
            SOURCE_OFFER.md
            "ffmpeg-kit-next-source-${{ needs.prepare.outputs.release_tag }}.tar.gz"
            "third-party-sources-${{ needs.prepare.outputs.release_tag }}.tar.gz"
          )
          for asset in "${required_assets[@]}"; do
            test -s "dist/$asset" || {
              echo "::error::Missing compliance release asset: $asset"
              exit 1
            }
          done

          fork_listing="$RUNNER_TEMP/fork-source-listing.txt"
          third_party_listing="$RUNNER_TEMP/third-party-source-listing.txt"
          tar -tzf "dist/ffmpeg-kit-next-source-${{ needs.prepare.outputs.release_tag }}.tar.gz" \
            > "$fork_listing"
          tar -tzf "dist/third-party-sources-${{ needs.prepare.outputs.release_tag }}.tar.gz" \
            > "$third_party_listing"
          grep -Fq '/changes.diff' "$fork_listing"
          for source_dir in ffmpeg gnu-config lame libvpx libiconv cpu_features x264 x265; do
            grep -Fq "/$source_dir/" "$third_party_listing"
          done

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.prepare.outputs.release_tag }}
          ARTIFACT_VERSION: ${{ needs.prepare.outputs.artifact_version }}
        shell: bash
        run: |
          set -euo pipefail

          if gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" dist/* \
              --clobber \
              --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$RELEASE_TAG" dist/* \
              --repo "$GITHUB_REPOSITORY" \
              --title "FFmpegKitNext ${ARTIFACT_VERSION}" \
              --generate-notes \
              --notes "Prebuilt artifacts for Android, Linux x86_64/ARM64, WebAssembly, iOS/iPadOS, Mac Catalyst, macOS, tvOS, and visionOS. Every Android artifact name explicitly ends in lgpl3 or gpl3 to prevent license confusion. The LGPLv3 builds include all-ABI and separate-ABI AARs, are intended for compliant integration into closed-source apps, and contain no GPL or nonfree configuration. The all-ABI GPLv3 build additionally includes x264 and x265 and is not a proprietary commercial license. Every Android package includes shared FFmpeg libraries, MediaCodec, libvpx, and libmp3lame. Apple, Linux, and Web artifacts remain LGPLv3. Corresponding source archives, BUILD_INFO.txt, third-party notices, LGPLv3 text, source availability information, and SHA-256 checksums are attached to this Release."
          fi
